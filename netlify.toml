[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."scheduled-notifications"]
  schedule = "*/30 * * * *"

# Proxy API calls to Netlify Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Handle client-side React routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
